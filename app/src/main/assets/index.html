   LAYOUT: одна колонка під телефон, нижня навігація, шторки знизу */
:root{color-scheme:light dark;

*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 Manrope,system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.wrap{max-width:520px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px 16px}

.grow{flex:1}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.ring{position:relative;width:150px;height:150px}

.ring .in{position:absolute;inset:0;display:grid;place-content:center;text-align:center}

@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media(prefers-reduced-motion:reduce){.sheet .bd{animation:none}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:20;font-size:14px}
@media(max-width:380px){.hero{grid-template-columns:120px minmax(0,1fr)}.ring,.ring svg{width:120px;height:120px}}
</style>
</head>

].map(a=>({n:a[0],k:a[1],p:a[2],f:a[3],c:a[4],u:a[5]||0,un:a[6]||''}));
const TPL=[
{n:'Full Body',ex:['Присідання зі штангою','Жим лежачи','Тяга штанги в нахилі','Жим гантелей сидячи','Планка']},
{n:'Груди + трицепс',ex:['Жим лежачи','Жим гантелей на похилій','Розведення гантелей','Віджимання на брусах','Французький жим']},

{n:'Кардіо',ex:['Біг']}];

// ---------- дані ----------
const LS='forma.v1';
let S={profile:{set:false,sex:'m',age:20,h:178,w:75,act:1.55,goal:'keep',water:8,kcal:0},custom:[],weights:[],days:{}};
try{const raw=localStorage.getItem(LS);if(raw){const o=JSON.parse(raw);S=Object.assign(S,o);S.profile=Object.assign({set:false,sex:'m',age:20,h:178,w:75,act:1.55,goal:'keep',water:8,kcal:0},o.profile||{})}}catch(e){}
const EMPTY=()=>({food:[],ex:[],water:0});
const day=k=>S.days[k]||EMPTY();
const dayW=k=>S.days[k]||(S.days[k]=EMPTY());
let coll=null,dirty=new Set(),inflight=new Set(),timer=null,chain=Promise.resolve(),sync='local';
const saveLocal=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};
function touch(key){saveLocal();if(!coll)return;dirty.add(key);clearTimeout(timer);timer=setTimeout(flush,600)}
function body(key){if(key==='main')return{profile:S.profile,custom:S.custom,weights:S.weights};const d=S.days[key.slice(2)]||EMPTY();return{food:d.food,ex:d.ex,water:d.water}}
function flush(){
  const keys=[...dirty];dirty.clear();
  keys.forEach(k=>{const b=JSON.parse(JSON.stringify(body(k)));inflight.add(k);
    chain=chain.then(()=>coll.doc(k).set(b)).then(()=>{inflight.delete(k);setSync('ok')},e=>{inflight.delete(k);
      if(e&&e.code==='unavailable'){dirty.add(k);clearTimeout(timer);timer=setTimeout(flush,4000)}

}
function applyDocs(docs){
  let ch=false;
  docs.forEach(d=>{const k=d.id;if(dirty.has(k)||inflight.has(k)||!d.exists)return;const v=JSON.parse(JSON.stringify(d.data()||{}));
    if(k==='main'){const cur=JSON.stringify(body('main'));if(v.profile)S.profile=Object.assign(S.profile,v.profile);S.custom=Array.isArray(v.custom)?v.custom:[];S.weights=Array.isArray(v.weights)?v.weights:[];if(cur!==JSON.stringify(body('main')))ch=true}
    else if(k.startsWith('d-')){const dk=k.slice(2),cur=JSON.stringify(body(k));S.days[dk]={food:Array.isArray(v.food)?v.food:[],ex:Array.isArray(v.ex)?v.ex:[],water:+v.water||0};if(cur!==JSON.stringify(body(k)))ch=true}});
  if(ch)saveLocal();return ch;

function syncHTML(){const m={local:['','Тільки на цьому пристрої'],load:['','Синхронізація…'],slow:['err','Немає зв’язку, дані можуть бути старі'],ok:['ok','Збережено в акаунті'],err:['err','Помилка збереження']}[sync];return`<span class="dot ${m[0]}"></span>${m[1]}`}
(async()=>{
  if(!window.claude||!claude.use)return;
  try{
    const [db,u]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!u)return;

    coll=db.collection('data/users/'+id);setSync('load');

    const snap=await coll.get();clearTimeout(t);
    if(snap.empty){if(S.profile.set||S.weights.length||Object.keys(S.days).length){dirty.add('main');Object.keys(S.days).forEach(k=>{const d=S.days[k];if(d.food.length||d.ex.length||d.water)dirty.add('d-'+k)});flush()}}
    else if(applyDocs(snap.docs))render();
    setSync('ok');
    coll.onSnapshot(s=>{if(s.metadata.hasPendingWrites)return;if(applyDocs(s.docs))render()},()=>setSync('err'));
  }catch(e){coll=null;setSync('local')}
})();

const curW=()=>{const w=[...S.weights].sort((a,b)=>a.d<b.d?-1:1);return w.length?w[w.length-1].kg:S.profile.w};
function targets(){
  const p=S.profile,w=curW();
  const bmr=10*w+6.25*p.h-5*p.age+(p.sex==='m'?5:-161);const tdee=bmr*p.act;
  const f={lose:.82,keep:1,gain:1.1}[p.goal]||1;
  let kcal=p.kcal>0?p.kcal:Math.round(tdee*f/10)*10;
  const prot=r0(w*(p.goal==='keep'?1.6:2)),fat=r0(w*.9),carb=Math.max(0,r0((kcal-prot*4-fat*9)/4));
  return{bmr:r0(bmr),tdee:r0(tdee),kcal,prot,fat,carb,water:p.water||8};
}
const sum=(arr)=>arr.reduce((a,i)=>({k:a.k+(+i.k||0),p:a.p+(+i.p||0),f:a.f+(+i.f||0),c:a.c+(+i.c||0)}),{k:0,p:0,f:0,c:0});

let roW=null,roK=null;
function drawCharts(){
  const ws=$('#wSvg'),ks=$('#kSvg');if(!ws||!ks)return;
  const dw=()=>{const W=ws.clientWidth,H=ws.clientHeight,pts=[...S.weights].sort((a,b)=>a.d<b.d?-1:1).slice(-30);
    if(pts.length<2){ws.innerHTML=`<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="var(--mut)" font-size="14">Запиши вагу хоча б 2 рази</text>`;return}
    const v=pts.map(p=>p.kg),mn=Math.min(...v)-0.5,mx=Math.max(...v)+0.5,L=36,R=10,Tp=12,B=24;
    const X=i=>L+i*(W-L-R)/(pts.length-1),Y=x=>Tp+(mx-x)/(mx-mn)*(H-Tp-B);
    const line=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.kg).toFixed(1)}`).join('');

    +`<path d="${line}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>`+pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.kg)}" r="3.5" fill="var(--acc)"/>`).join('')
    +`<text x="${L}" y="${H-6}" font-size="11" fill="var(--mut)">${esc(fmtD(pts[0].d))}</text><text x="${W-R}" y="${H-6}" font-size="11" text-anchor="end" fill="var(--mut)">${esc(fmtD(pts[pts.length-1].d))}</text>`};
  const dk=()=>{const W=ks.clientWidth,H=ks.clientHeight,T=targets().kcal,days=Array.from({length:7},(_,i)=>addDays(today(),i-6)),v=days.map(k=>sum(day(k).food).k);
    const mx=Math.max(T*1.25,...v),B=22,Tp=8,bw=(W-12)/7;const Y=x=>Tp+(1-x/mx)*(H-Tp-B);

    +`<line x1="4" x2="${W-4}" y1="${Y(T)}" y2="${Y(T)}" stroke="var(--ink)" stroke-dasharray="4 4" opacity=".5"/>`};
  roW&&roW.disconnect();roK&&roK.disconnect();roW=new ResizeObserver(dw);roW.observe(ws);roK=new ResizeObserver(dk);roK.observe(ks);

async function gemini(prompt,opts){
  let last=null;
  for(const m of ['gemini-flash-latest','gemini-2.5-flash','gemini-2.0-flash']){
    let r;try{r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent',{method:'POST',signal:opts&&opts.signal,headers:{'Content-Type':'application/json','x-goog-api-key':GK},body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{temperature:0.2,responseMimeType:'application/json'}})})}
    catch(e){if(e&&e.name==='AbortError')throw e;throw{code:'offline'}}
    if(r.status===404){last={code:'err'};continue}
    if(!r.ok)throw{code:r.status===429?'rate_limited':(r.status===400||r.status===401||r.status===403)?'bad_key':'err'};
    const j=await r.json();const t=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts||[]).map(p=>p.text||'').join('');
    return{text:t};
  }
  throw last||{code:'err'};
}

  const cust=S.custom.map(f=>({...f,mine:1}));let list;
  if(!q){const rc=recents();list=(rc.length?[{hdr:'Недавні'},...rc]:[]).concat([{hdr:'Продукти'}],cust,FOODS)}
  else list=cust.concat(FOODS,recents()).filter(f=>f.n.toLowerCase().includes(q)).slice(0,40);
  window._fl=list;
  el.innerHTML=list.map((f,i)=>f.hdr?`<div class="sm mut" style="margin-top:10px">${f.hdr}</div>`:`<div class="item" data-pick="${i}"><div class="grow"><div class="nm">${esc(f.n)}${f.mine?' <span class="sm mut">· моє</span>':''}</div><div class="sm mut">Б ${r1(f.p)} Ж ${r1(f.f)} В ${r1(f.c)} на 100 г</div></div><span class="k">${r0(f.k)}</span></div>`).join('')||'<div class="empty">Нічого не знайшов — додай у «Своє» або спитай ШІ</div>';
}
function portion(f){
  P=f;const g0=f.u||100;
  openSheet(`<div class="row sp"><h2>${esc(f.n)}</h2><button class="x" aria-label="Закрити" data-close="1">${I.x}</button></div>
  <div class="chips">${MEALS.map(([m,n])=>`<button class="chip ${FM===m?'on':''}" data-fm2="${m}">${n}</button>`).join('')}</div>
  <label for="pg">Вага, г</label><input id="pg" inputmode="decimal" value="${r0(g0)}">
  <div class="chips">${f.u&&f.un!=='як минулого'?[1,2,3].map(n=>`<button class="chip" data-g="${f.u*n}">${n} ${esc(f.un)}</button>`).join(''):''}${[50,100,150,200,300].map(g=>`<button class="chip" data-g="${g}">${g} г</button>`).join('')}</div>
  <div class="card" id="pv"></div><button class="btn w" style="margin-top:12px" data-addp="1">Додати</button><button class="btn sec w" style="margin-top:8px" data-back="1">Назад</button>`);
  const pg=$('#pg');pg.oninput=pv;pv();
}
function pv(){const g=num($('#pg').value),f=P,m=g/100;$('#pv').innerHTML=`<div class="row sp"><div><div class="big2">${r0(f.k*m)}</div><div class="sm mut">ккал</div></div><div class="sm" style="text-align:right"><div>Білки <b>${r1(f.p*m)} г</b></div><div>Жири <b>${r1(f.f*m)} г</b></div><div>Вугл. <b>${r1(f.c*m)} г</b></div></div></div>`}
function pushFood(it){dayW(cur).food.push({id:nid(),m:FM,...it});touch('d-'+cur)}

// тренування
let W=null,WD=null,WID=null;
function lastFor(name){for(const k of Object.keys(S.days).sort().reverse())for(const w of S.days[k].ex){if(w.id===WID)continue;const e=w.ex.find(e=>e.n===name);if(e&&e.sets.length)return{d:k,s:e.sets}}return null}
function newWorkout(){
  const all=allWorkouts();
  openSheet(`<div class="row sp"><h2>Нове тренування</h2><button class="x" aria-label="Закрити" data-close="1">${I.x}</button></div>
  ${all.length?`<button class="btn w" style="margin-top:10px" data-repeat="1">Повторити: ${esc(all[0].w.n||'останнє')}</button>`:''}
  <div class="sm mut" style="margin-top:12px">Шаблони</div>
  ${TPL.map((t,i)=>`<div class="item" data-tpl="${i}" style="cursor:pointer"><div class="grow"><div class="nm">${esc(t.n)}</div><div class="sm mut">${t.ex.map(esc).join(', ')}</div></div>${I.r}</div>`).join('')}
  <button class="btn sec w" style="margin-top:10px" data-tpl="-1">Пусте тренування</button>`);
}
function startW(w,d,id){W=JSON.parse(JSON.stringify(w));WD=d;WID=id;editW()}
function editW(){
  const exH=W.ex.map((e,i)=>{const l=lastFor(e.n);return`<div class="ex"><div class="row sp"><input value="${esc(e.n)}" data-en="${i}" list="exl" style="font-weight:700"><button class="x" aria-label="Прибрати вправу" data-delex="${i}">${I.x}</button></div>
    ${l?`<div class="hint">Минулого разу: ${l.s.map(s=>`${r0(s.r)}×${r1(s.w)}`).join(', ')}</div>`:''}
    <div class="set sm mut" style="margin-top:8px"><span>#</span><span>Повтори</span><span>Вага, кг</span><span></span></div>
    ${e.sets.map((s,j)=>`<div class="set"><span class="mut">${j+1}</span><input inputmode="numeric" value="${esc(s.r)}" data-sr="${i}.${j}" placeholder="10"><input inputmode="decimal" value="${esc(s.w)}" data-sw="${i}.${j}" placeholder="0"><button class="x" aria-label="Прибрати підхід" data-delset="${i}.${j}">${I.x}</button></div>`).join('')}
    <button class="add" data-addset="${i}">${I.plus} Підхід</button></div>`}).join('');
  openSheet(`<div class="row sp"><h2>${WID?'Тренування':'Нове тренування'}</h2><button class="x" aria-label="Закрити" data-close="1">${I.x}</button></div>
  <div class="sm mut">${esc(fmtD(WD))}</div>
  <label for="wn">Назва</label><input id="wn" value="${esc(W.n)}" data-wf="n">
  ${exH}
  <div class="row" style="margin-top:10px"><input id="nex" list="exl" placeholder="Додати вправу"><button class="btn sec" data-addex="1">${I.plus}</button></div>
  <datalist id="exl">${EXALL.map(e=>`<option value="${esc(e)}">`).join('')}</datalist>
  <div class="g2"><div><label for="wmin">Тривалість, хв</label><input id="wmin" inputmode="numeric" value="${esc(W.min)}" data-wf="min"></div><div><label for="wk">Спалено, ккал</label><input id="wk" inputmode="numeric" value="${W.kcal?esc(W.kcal):''}" data-wf="kcal" placeholder="авто"></div></div>
  <div class="hint">Якщо не вписати ккал — порахую приблизно з тривалості і ваги. Трені вже враховані в нормі через «Активність» у профілі, тому спалене до норми не додається.</div>
  <button class="btn w" style="margin-top:12px" data-savewk="1">Зберегти</button>
  ${WID?`<button class="btn sec w" style="margin-top:8px;color:var(--acc2)" data-delw="1">Видалити тренування</button>`:''}`);
}

// ---------- події ----------
document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-pick],[data-editw],[data-tpl]');if(!b)return;const ds=b.dataset;
  if(ds.tab){tab=ds.tab;if(!sheet.classList.contains('hidden'))sheet.classList.add('hidden');render();window.scrollTo(0,0);return}
  if(ds.day){cur=addDays(cur,+ds.day);render();return}
  if(ds.water){const d=dayW(cur);d.water=Math.max(0,d.water+ +ds.water);touch('d-'+cur);render();return}
  if(ds.delfood){const d=dayW(cur);d.food=d.food.filter(f=>f.id!==ds.delfood);touch('d-'+cur);render();return}
  if(ds.addfood){FM=ds.addfood;FT='find';foodSheet();return}
  if(ds.close){closeSheet();return}
  if(ds.fm){FM=ds.fm;sbd.querySelectorAll('[data-fm]').forEach(x=>x.classList.toggle('on',x.dataset.fm===FM));return}
  if(ds.fm2){FM=ds.fm2;sbd.querySelectorAll('[data-fm2]').forEach(x=>x.classList.toggle('on',x.dataset.fm2===FM));return}
  if(ds.ft){FT=ds.ft;foodSheet();if(FT==='ai')getAI().then(s=>{if(!s&&$('#aiR')){$('#aiB').disabled=true;$('#aiR').innerHTML=window.claude?'<div class="empty">ШІ тут недоступний — скористайся пошуком або «Своє».</div>':'<div class="empty">Щоб ШІ працював, встав ключ Gemini в Профілі.</div><button class="btn sec w" data-tab="prof">Відкрити профіль</button>'}});return}
  if(ds.savekey){const k=$('#gk').value.trim();if(k.length<20){toast('Ключ закороткий');return}setGkey(k);toast('Ключ збережено');render();return}
  if(ds.delkey){setGkey('');toast('Ключ видалено');render();return}
  if(ds.pick!==undefined){const f=window._fl[+ds.pick];if(f&&!f.hdr)portion(f);return}
  if(ds.g){$('#pg').value=r0(+ds.g);pv();return}
  if(ds.back){foodSheet();return}
  if(ds.addp){const g=num($('#pg').value);if(g<=0){toast('Вкажи вагу');return}const m=g/100;pushFood({n:P.n,g,k:r1(P.k*m),p:r1(P.p*m),f:r1(P.f*m),c:r1(P.c*m)});toast('Додано');closeSheet();return}
  if(ds.savecustom){const n=$('#cN').value.trim(),k=num($('#cK').value);if(!n||k<=0){toast('Назва і ккал обов’язкові');return}
    const f={id:nid(),n,k,p:num($('#cP').value),f:num($('#cF').value),c:num($('#cC').value)};S.custom.unshift(f);touch('main');portion(f);return}
  if(ds.quick){const n=$('#qN').value.trim()||'Перекус',k=num($('#qK').value);if(k<=0){toast('Вкажи ккал');return}pushFood({n,g:0,k,p:0,f:0,c:0});toast('Додано');closeSheet();return}
  if(ds.ai){runAI();return}
  if(ds.aiadd){const picks=[...sbd.querySelectorAll('[data-aichk]')].filter(x=>x.checked).map(x=>AIres[+x.dataset.aichk]);if(!picks.length){toast('Нічого не вибрано');return}
    picks.forEach(it=>pushFood(it));toast('Додано: '+picks.length);closeSheet();return}
  if(ds.delcustom){S.custom=S.custom.filter(f=>f.id!==ds.delcustom);touch('main');render();return}
  if(ds.goal){S.profile.goal=ds.goal;S.profile.set=true;touch('main');render();return}
  if(ds.savew){const kg=num($('#wIn').value);if(kg<25||kg>350){toast('Вкажи вагу в кг');return}const t=today();S.weights=S.weights.filter(x=>x.d!==t);S.weights.push({d:t,kg:r1(kg)});S.profile.w=r1(kg);touch('main');toast('Вагу записано');render();return}
  if(ds.neww){newWorkout();return}
  if(ds.tpl!==undefined){const i=+ds.tpl,t=TPL[i];startW({n:t?t.n:'Тренування',ex:t?t.ex.map(n=>({n,sets:[{r:'',w:''},{r:'',w:''},{r:'',w:''}]})):[],min:'',kcal:0},cur,null);return}
  if(ds.repeat){const w=allWorkouts()[0].w;startW({n:w.n,ex:w.ex.map(e=>({n:e.n,sets:e.sets.map(s=>({r:s.r,w:s.w}))})),min:w.min,kcal:0},cur,null);return}
  if(ds.editw){const d=ds.wd||cur,w=day(d).ex.find(x=>x.id===ds.editw);if(w)startW(w,d,w.id);return}
  if(ds.addset){const e=W.ex[+ds.addset],l=e.sets[e.sets.length-1];e.sets.push({r:l?l.r:'',w:l?l.w:''});editW();return}
  if(ds.delset){const[i,j]=ds.delset.split('.').map(Number);W.ex[i].sets.splice(j,1);editW();return}
  if(ds.delex){W.ex.splice(+ds.delex,1);editW();return}
  if(ds.addex){const n=$('#nex').value.trim();if(!n)return;W.ex.push({n,sets:[{r:'',w:''},{r:'',w:''},{r:'',w:''}]});editW();return}
  if(ds.savewk){
    W.ex=W.ex.map(e=>({n:e.n.trim()||'Вправа',sets:e.sets.filter(s=>String(s.r).trim()!==''||String(s.w).trim()!=='').map(s=>({r:num(s.r),w:num(s.w)}))})).filter(e=>e.sets.length||W.ex.length===1);
    W.min=num(W.min);W.kcal=num(W.kcal);if(!W.kcal&&W.min)W.kcal=r0(4*3.5*curW()/200*W.min);
    const d=dayW(WD);if(WID){const i=d.ex.findIndex(x=>x.id===WID);if(i>=0)d.ex[i]={...W,id:WID}}else d.ex.push({...W,id:nid()});
    touch('d-'+WD);toast('Тренування збережено');closeSheet();return}
  if(ds.delw){const d=dayW(WD);d.ex=d.ex.filter(x=>x.id!==WID);touch('d-'+WD);toast('Видалено');closeSheet();return}
});
document.addEventListener('input',e=>{
  const t=e.target,ds=t.dataset;
  if(ds.en!==undefined)W.ex[+ds.en].n=t.value;
  if(ds.sr){const[i,j]=ds.sr.split('.').map(Number);W.ex[i].sets[j].r=t.value}
  if(ds.sw){const[i,j]=ds.sw.split('.').map(Number);W.ex[i].sets[j].w=t.value}
  if(ds.wf)W[ds.wf]=t.value;
});
document.addEventListener('change',e=>{
  const t=e.target,k=t.dataset.pf;if(!k)return;const p=S.profile;
  if(k==='sex')p.sex=t.value;else if(k==='act')p.act=+t.value;
  else if(k==='w'){const kg=num(t.value);if(kg>=25&&kg<=350){p.w=r1(kg);const td=today();S.weights=S.weights.filter(x=>x.d!==td);S.weights.push({d:td,kg:p.w})}}
  else{const v=num(t.value);if(k==='kcal')p.kcal=v>=800?r0(v):0;else if(v>0)p[k]=r0(v)}
  p.set=true;touch('main');render();
});

async function runAI(){
  const txt=$('#aiT').value.trim();if(!txt){toast('Опиши, що з’їв');return}
  const s=await getAI();const out=$('#aiR'),btn=$('#aiB');
  if(!s){out.innerHTML='<div class="empty">'+(window.claude?'ШІ тут недоступний.':'Встав ключ Gemini в Профілі.')+'</div>';return}
  btn.disabled=true;btn.textContent='Рахую…';out.innerHTML='';
  aiCtl&&aiCtl.abort();aiCtl=new AbortController();
  const prompt=`Ти нутриціолог. Користувач описав, що з'їв. Розбий опис на окремі продукти або страви, для кожного оціни реалістичну вагу порції в грамах і калорійність та БЖВ саме на цю порцію (типові українські порції). Відповідай ТІЛЬКИ JSON-масивом без пояснень, у форматі: [{"n":"назва українською","g":грами,"k":ккал,"p":білки_г,"f":жири_г,"c":вуглеводи_г}]. Числа — без одиниць.\nОпис: ${txt}`;
  try{
    const r=await s(prompt,{signal:aiCtl.signal,modelTier:'quick'});
    const t=r.text||'',a=t.indexOf('['),z=t.lastIndexOf(']');
    const arr=a>=0&&z>a?JSON.parse(t.slice(a,z+1)):[];
    AIres=(Array.isArray(arr)?arr:[]).filter(x=>x&&x.n).slice(0,20).map(x=>({n:String(x.n).slice(0,80),g:r0(num(x.g)),k:r0(num(x.k)),p:r1(num(x.p)),f:r1(num(x.f)),c:r1(num(x.c))}));
    if(!AIres.length){out.innerHTML='<div class="empty">Не вдалося розібрати. Спробуй написати простіше.</div>'}
    else{const tot=sum(AIres);out.innerHTML=`<div class="card">${AIres.map((x,i)=>`<label class="item" style="margin:0;color:var(--ink);font-size:16px"><input type="checkbox" checked data-aichk="${i}" style="width:22px;min-height:22px;flex:none"><div class="grow"><div class="nm">${esc(x.n)}</div><div class="sm mut">${x.g} г · Б ${x.p} Ж ${x.f} В ${x.c}</div></div><span class="k">${x.k}</span></label>`).join('')}
      <div class="row sp" style="margin-top:8px"><b>Разом</b><span class="k num">${r0(tot.k)} ккал</span></div><div class="hint">Це приблизна оцінка ШІ.</div></div><button class="btn w" style="margin-top:10px" data-aiadd="1">Додати вибране</button>`}
  }catch(e){
    if(e&&e.name==='AbortError')return;
    out.innerHTML=`<div class="empty">${e&&e.code==='rate_limited'?'Забагато запитів, спробуй за хвилину.':e&&e.code==='not_granted'?'Доступ до ШІ не надано.':e&&e.code==='bad_key'?'Ключ не підходить — перевір його в Профілі.':e&&e.code==='offline'?'Немає інтернету.':'Не вийшло порахувати, спробуй ще раз.'}</div>`;
  }finally{if(btn){btn.disabled=false;btn.textContent='Порахувати'}}
}

window.forBack=()=>{if(!sheet.classList.contains('hidden')){closeSheet();return true}if(tab!=='today'){tab='today';render();return true}return false};
if(!S.profile.set)tab='today';
render();
}
</script>
</body>
</html>
