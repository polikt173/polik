<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0b0c0e">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Форма — тренування і харчування</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: коротко, як табло в залі — цифра головна, решта тихо
   IDEA: щоденник атлета + табло калорій
   PICTURE: велике градієнтне кільце «залишилось ккал» з макро-смугами
   COLOUR and TYPE: нічний зал — графіт, крейда, гарячий помаранчевий; Archivo для цифр, Manrope для тексту
   LAYOUT: одна колонка під телефон, нижня навігація, шторки знизу */
:root{color-scheme:dark;--bg:#0b0c0e;--card:#15161a;--card2:#202127;--ink:#f4f2ee;--mut:#8e8c88;--line:#24252b;
--acc:#ff5a36;--acc2:#ff7d5c;--amb:#ffb03b;--p:#4d9bff;--f:#ffc23d;--c:#34d39e;--ok:#34d39e;--ease:cubic-bezier(.2,.8,.2,1);--c1:#18191d;--c2:#141518;--sh:#111215;--navrgb:17,18,21;--accg:#ff7a3d;--accrgb:255,90,54;--acc2rgb:255,140,50;--ambrgb:255,176,59;--onacc:#fff;--dim:#3a3b42;--card3:#2e2f36}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 Manrope,system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(92px + env(safe-area-inset-bottom));
background:radial-gradient(900px 420px at 50% -180px,rgba(var(--accrgb),.16),transparent 70%) no-repeat,var(--bg)}
.wrap{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px 16px}
h1,h2,h3,.num{font-family:Archivo,system-ui,sans-serif;margin:0;letter-spacing:-.01em}
h1{font-size:32px;line-height:1.05;font-weight:800;margin:6px 0 4px}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
.mut{color:var(--mut)}.sm{font-size:13px}
.card{background:linear-gradient(180deg,var(--c1),var(--c2));border:1px solid var(--line);border-radius:20px;padding:14px;margin-top:12px;overflow:hidden;overflow-wrap:anywhere}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.row>.btn,.row>.ico{flex:none}
.grow{flex:1;min-width:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;transition:transform .14s var(--ease),background .2s,color .2s,opacity .2s}
button:active{transform:scale(.96)}
button:disabled{opacity:.5}
.btn{min-height:46px;padding:10px 16px;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--accg));color:var(--onacc);font-weight:700;box-shadow:0 6px 18px rgba(var(--accrgb),.25);white-space:nowrap}
.btn.sec{background:var(--card2);color:var(--ink);box-shadow:none}
.btn.dang{background:rgba(var(--accrgb),.12);color:var(--acc2);box-shadow:none}
.btn.w{width:100%}
.ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--card2)}
.ico svg{width:20px;height:20px}
input,select,textarea{font:16px Manrope,system-ui,sans-serif;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;width:100%;transition:border-color .2s,box-shadow .2s}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(var(--accrgb),.18)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{min-height:38px;padding:8px 11px;border-radius:999px;background:var(--card2);font-size:13.5px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg)}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datebar .t{text-align:center;flex:1;min-width:0}
.sync{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;background:var(--mut);flex:none;border-radius:50%}
.dot.ok{background:var(--ok)}.dot.err{background:var(--acc)}
.hero{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:150px;height:150px;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:0 18px}
.ring .big{font-family:Archivo,system-ui,sans-serif;font-weight:800;font-size:clamp(26px,8vw,34px);line-height:1;white-space:nowrap}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;padding:5px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border:0}
.stat b{font-family:Archivo,system-ui,sans-serif;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:8px;border-radius:9px;background:var(--card2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:9px;transform-origin:left;transition:width .9s cubic-bezier(.3,.9,.3,1)}
.macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.mv{font-family:Archivo,system-ui,sans-serif;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mv span{color:var(--mut);font-size:12px}.xtra{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.xtra .mv{font-size:14px}.xtra .bar{height:6px}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
h3+.item,.item:first-child{border-top:0}
.item .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .k,.k{font-family:Archivo,system-ui,sans-serif;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;flex:none}
.x{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mut);flex:none}
.x:hover{background:var(--card2)}
.add{display:flex;align-items:center;gap:6px;color:var(--acc2);font-weight:700;min-height:42px;margin-top:2px}
.water{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.water i{width:22px;height:28px;border-radius:4px 4px 9px 9px;border:2px solid rgba(var(--prgb),.5);display:block;transition:background .3s var(--ease),transform .3s var(--ease)}
.water i.on{background:linear-gradient(180deg,var(--waterhi),var(--p));border-color:var(--p)}
.water i.pop{animation:pop .4s var(--ease)}
@keyframes pop{50%{transform:scale(1.25)}}
.banner{background:linear-gradient(135deg,var(--acc),var(--accg));color:var(--onacc);border-radius:20px;padding:16px;margin-top:12px}
.banner .btn{background:var(--onacc);color:var(--acc);margin-top:10px;box-shadow:none}
.empty{color:var(--mut);font-size:14px;padding:6px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(var(--navrgb),.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--mut);min-height:54px;justify-content:center;white-space:nowrap;overflow:hidden}
nav button span.p{display:grid;place-items:center;width:52px;height:30px;border-radius:999px;transition:background .25s var(--ease)}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--acc2)}
nav button.on span.p{background:rgba(var(--accrgb),.16)}
.sheet{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden{display:none}
.sheet .bg{position:absolute;inset:0;background:rgba(0,0,0,.6);animation:fade .25s ease both}
.sheet .bd{position:relative;background:var(--sh);border:1px solid var(--line);border-bottom:0;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:12px 14px calc(18px + env(safe-area-inset-bottom));animation:up .34s var(--ease) both}
.sheet.closing .bg{animation:fade .22s ease reverse both}
.sheet.closing .bd{animation:down .22s ease-in both}
@keyframes up{from{transform:translateY(100%)}}
@keyframes down{to{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--dim);margin:0 auto 12px}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--card2);border-radius:13px;padding:3px;margin:12px 0}
.tabs button{min-height:40px;border-radius:10px;font-weight:700;font-size:14px}
.tabs button.on{background:var(--card3)}
.res{max-height:48vh;overflow:auto}
.res .item{cursor:pointer}
.big2{font-family:Archivo,system-ui,sans-serif;font-weight:800;font-size:40px;line-height:1}
.set{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) 36px;gap:6px;align-items:center;margin-top:6px}
.set input{min-height:40px;padding:8px;text-align:center}
.ex{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin-top:10px}
.hint{font-size:12px;color:var(--mut);margin-top:4px}
.fig{position:relative;height:190px;margin-top:8px}.fig svg{position:absolute;inset:0;width:100%;height:100%}
.kp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.kp div{background:var(--card2);border-radius:14px;padding:10px;min-width:0}
.kp b{font-family:Archivo,system-ui,sans-serif;font-size:clamp(16px,5.2vw,21px);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kp span{display:block;line-height:1.25}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;z-index:20;font-size:14px;animation:tin .3s var(--ease);max-width:90vw;text-align:center}
@keyframes tin{from{opacity:0;transform:translate(-50%,12px)}}
.anim>*{animation:rise .45s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translate(var(--dx,0px),14px)}}
.anim .arc{animation:ring 1s var(--ease) .1s both}
@keyframes ring{from{stroke-dashoffset:var(--c)}}
.anim .bar i{animation:grow .8s var(--ease) .2s both}
@keyframes grow{from{transform:scaleX(0)}}
.fadein{animation:fade .25s ease both}
.scanbox{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:4/3;margin-top:4px}.scanbox video{width:100%;height:100%;object-fit:cover;display:block;background:#000}.scanwait{position:absolute;inset:0;display:grid;place-items:center;color:#cfcfcf;font-size:14px;pointer-events:none}.scanline{position:absolute;left:10%;right:10%;top:50%;height:2px;background:var(--acc);box-shadow:0 0 12px var(--acc);animation:scan 1.6s ease-in-out infinite alternate}@keyframes scan{from{transform:translateY(-60px)}to{transform:translateY(60px)}}
.sec-t{font-size:13px;color:var(--mut);font-weight:700;margin:18px 2px 0}
@media(max-width:380px){.hero{grid-template-columns:120px minmax(0,1fr);gap:12px}.ring,.ring svg{width:120px;height:120px}.macros{gap:8px}}
.top{display:flex;align-items:center;gap:10px}.top h1{margin:2px 0 0}
.streak{display:flex;align-items:center;gap:4px;background:rgba(var(--acc2rgb),.12);border:1px solid rgba(var(--acc2rgb),.3);border-radius:999px;padding:6px 12px 6px 8px;font-family:Archivo,system-ui,sans-serif;font-size:17px;flex:none}
.streak svg{width:20px;height:20px;animation:flick 1.6s ease-in-out infinite alternate}
@keyframes flick{to{transform:scale(1.12) rotate(-4deg)}}
.daynav{display:flex;align-items:center;justify-content:space-between;background:var(--card2);border-radius:999px;margin-top:12px;padding:3px}
.daynav button{width:40px;height:38px;border-radius:999px;display:grid;place-items:center}.daynav button svg{width:18px;height:18px}
.daynav span{font-weight:700;font-size:14px}
.hero2{display:block;background:radial-gradient(120% 90% at 0% 0%,rgba(var(--accrgb),.14),transparent 60%),radial-gradient(90% 80% at 100% 0%,rgba(var(--prgb),.12),transparent 60%),linear-gradient(180deg,var(--c1),var(--c2))}
.hero2>.rings{float:left;margin-right:14px}
.rings{position:relative;width:168px;height:168px}.rings svg{width:168px;height:168px;transform:rotate(-90deg);filter:drop-shadow(0 0 10px rgba(var(--accrgb),.18))}
.rings .in{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rings .big{font-family:Archivo,system-ui,sans-serif;font-weight:800;font-size:25px;line-height:1}.rings .in .sm{font-size:11px}
.legend{display:grid;gap:10px;padding-top:12px}
.legend div{display:grid;grid-template-columns:10px minmax(0,1fr);column-gap:8px;align-items:center}
.legend i{width:10px;height:10px;border-radius:50%;grid-row:span 2}
.legend span{font-size:12px}.legend b{font-family:Archivo,system-ui,sans-serif;font-size:18px;white-space:nowrap}.legend small{font-size:12px;color:var(--mut);font-weight:500}
.legend .burn{display:block;font-size:12px;color:var(--amb);font-weight:700}
.hero2 .macros{clear:both;padding-top:6px}
.wcard{display:flex;align-items:center;gap:16px;background:radial-gradient(100% 120% at 0% 100%,rgba(var(--wrgb),.16),transparent 60%),linear-gradient(180deg,var(--c1),var(--c2))}
.glass{width:60px;height:80px;flex:none}
.wave{transition:transform 1.1s cubic-bezier(.3,.9,.3,1)}.wave .w1{animation:wave 2.6s linear infinite}.wave .w2{animation:wave 3.8s linear infinite reverse}.arc.sm2{transition:stroke-dashoffset 1s cubic-bezier(.3,.9,.3,1)}
@keyframes wave{to{transform:translateX(60px)}}
.wbtn{background:linear-gradient(135deg,var(--water),var(--water2));box-shadow:0 6px 18px rgba(var(--wrgb),.25);flex:1}
.meal{background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--m1) 14%,transparent),transparent 55%),linear-gradient(180deg,var(--c1),var(--c2))}
.mic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--m1),var(--m2));box-shadow:0 6px 16px color-mix(in srgb,var(--m1) 35%,transparent);flex:none}
.mic svg{width:22px;height:22px}
.plus{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--m1) 18%,transparent);color:var(--m1);flex:none}
.plus svg{width:20px;height:20px}
.mlist{margin-top:8px;border-top:1px solid var(--line)}
.tip{border-color:rgba(var(--ambrgb),.25);background:linear-gradient(135deg,rgba(var(--ambrgb),.1),rgba(var(--accrgb),.04))}
nav .in{grid-template-columns:repeat(5,minmax(0,1fr))!important}
nav .fab{overflow:visible}
nav .fab span{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:var(--onacc);background:linear-gradient(135deg,var(--acc),var(--amb));box-shadow:0 8px 24px rgba(var(--accrgb),.45),0 0 0 5px var(--bg);transform:translateY(-16px)}
nav .fab svg{width:26px;height:26px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
.confetti i{position:absolute;bottom:22%;width:8px;height:12px;border-radius:2px;animation:conf 1.4s cubic-bezier(.2,.7,.4,1) both}
@keyframes conf{0%{transform:translate(0,0) rotate(0);opacity:1}70%{opacity:1}100%{transform:translate(var(--x),calc(var(--y) + 260px)) rotate(var(--r));opacity:0}}
@media(max-width:380px){.rings,.rings svg{width:146px;height:146px}.rings .big{font-size:22px}.rings .in .sm{font-size:10px}.legend b{font-size:16px}}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.tcard{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px;border-radius:20px;border:1px solid var(--line);background:radial-gradient(120% 120% at 0% 0%,color-mix(in srgb,var(--m1) 22%,transparent),transparent 60%),var(--c2);min-height:150px;overflow:hidden;width:100%}
.tcard b{font-family:Archivo,system-ui,sans-serif;font-size:16px;line-height:1.15;margin-top:4px}
.tcard .mic{width:40px;height:40px;border-radius:13px}
.tex{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto;width:100%}.tex i{font-style:normal;font-size:11px;line-height:1.2;padding:3px 7px;border-radius:999px;background:rgba(255,255,255,.06);color:#c9c7c2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rep{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:12px;padding:14px;border-radius:20px;border:1px solid rgba(var(--acc2rgb),.35);background:linear-gradient(135deg,rgba(var(--ambrgb),.14),rgba(var(--accrgb),.06))}
.rep b{display:block;font-family:Archivo,system-ui,sans-serif;font-size:17px}.rep .sm{display:block}.rep>svg{width:20px;height:20px;color:var(--mut);flex:none}
.tempty{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;margin-top:10px;border-radius:16px;border:1.5px dashed var(--dim);color:var(--mut);font-weight:700}
.tempty svg{width:18px;height:18px}
.mrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}.mrow b{display:block;font-size:15px}.mrow .sm{display:block}
.mt{font-family:Archivo,system-ui,sans-serif;font-weight:700;font-size:15px;min-width:46px;color:var(--ink);font-variant-numeric:tabular-nums}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--dim);display:grid;place-items:center;flex:none;transition:all .25s var(--ease)}
.chk svg{width:16px;height:16px;opacity:0;transform:scale(.4);transition:all .25s var(--ease);color:#fff}
.mrow.done .chk{background:var(--m1);border-color:var(--m1)}.mrow.done .chk svg{opacity:1;transform:none}
.mrow.done b{text-decoration:line-through;color:var(--mut)}
.rdot{width:10px;height:10px;border-radius:50%;flex:none}
.tog{width:44px;height:26px;border-radius:999px;background:var(--dim);position:relative;flex:none}
.tog i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .25s var(--ease)}
.tog.on{background:var(--ok)}.tog.on i{transform:translateX(18px)}
.nbar{display:flex;align-items:center;gap:12px;border-color:rgba(var(--ambrgb),.3)}.nbar .mic{color:#fff}.nbar .mic svg{width:22px;height:22px}
.inf{padding:8px 0;border-top:1px solid var(--line)}.inf:first-child{border-top:0}
nav button{padding:0;letter-spacing:-.02em}
/* анімації v2.4 */
body{transition:background-color .4s}
html,.wrap{overflow-x:clip}
body.thfade #view,body.thfade nav{animation:thf .45s var(--ease)}
@keyframes thf{from{opacity:.35;filter:saturate(.3)}}
.btn,.chip,.tcard,.plus,.lnk,.rep{position:relative;overflow:hidden;isolation:isolate}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.22;transform:scale(0);pointer-events:none;animation:rip .6s ease-out forwards;z-index:-1}
@keyframes rip{to{transform:scale(1);opacity:0}}
nav button.on span.p{animation:pill .35s var(--ease)}
@keyframes pill{from{transform:scaleX(.4);opacity:0}}
nav .fab span{transition:transform .35s var(--ease)}
body:has(#sheet:not(.hidden):not(.closing)) nav .fab span{transform:translateY(-16px) rotate(135deg)}
.sheet .bg{backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.rings svg{animation:glow 3.2s ease-in-out infinite alternate}
@keyframes glow{to{filter:drop-shadow(0 0 16px rgba(var(--accrgb),.35))}}
.item.newi{animation:newi .9s var(--ease)}
@keyframes newi{0%{opacity:0;transform:translateX(-18px);background:rgba(var(--accrgb),.18)}60%{opacity:1;transform:none;background:rgba(var(--accrgb),.12)}100%{background:transparent}}
.tcard{transition:transform .2s var(--ease),border-color .2s}.tcard:active{transform:scale(.97);border-color:var(--m1)}
.card{transition:border-color .3s}
.thg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.thc{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:12px;border-radius:16px;border:1.5px solid var(--line);text-align:left;min-height:76px}
.thc.on{border-color:var(--acc);box-shadow:0 0 0 3px rgba(var(--accrgb),.18)}
.thc .sw{display:flex;gap:4px}.thc .sw i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(255,255,255,.12)}
.thc b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.plat{margin-top:12px;padding:12px 14px;border-radius:14px;background:rgba(var(--ambrgb),.1);border:1px solid rgba(var(--ambrgb),.28)}.plat b{color:var(--amb);font-size:14px}.plat .sm{margin-top:4px;line-height:1.4}
.exi{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--card2);font-size:14px;line-height:1.45;animation:fade .25s ease}.exi ol{margin:4px 0 0;padding-left:18px}.exi .lbl{font-size:12px;font-weight:700;color:var(--acc2);margin-top:8px}
.qx{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mut);flex:none;font-weight:800;font-family:Archivo,system-ui,sans-serif}.qx.on{background:rgba(var(--accrgb),.16);color:var(--acc2)}
.sgo{padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--card);margin-top:10px}.sgo .it{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0}.sgo .it span:last-child{color:var(--mut);white-space:nowrap}
.rvl{display:flex;gap:8px;align-items:flex-start;margin-top:6px;line-height:1.4}.rvl>span:first-child{flex:none;margin-top:2px}.rvl svg{width:16px;height:16px}
.rv{background:radial-gradient(120% 90% at 100% 0%,rgba(var(--accrgb),.12),transparent 60%),linear-gradient(180deg,var(--c1),var(--c2))}
body.calm *,body.calm *::before,body.calm *::after{animation:none!important;transition:none!important}
@media(max-width:350px){nav button{font-size:10px}}
.mact{margin-top:6px}
.lnk{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 12px;border-radius:999px;background:color-mix(in srgb,var(--m1,var(--acc)) 14%,transparent);color:var(--m1,var(--acc));font-weight:700;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vrow{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-top:8px;scrollbar-width:none}.vrow::-webkit-scrollbar{display:none}
.vrow .chip{flex:none}
.rest{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;border-radius:16px;background:linear-gradient(135deg,rgba(var(--wrgb),.14),rgba(var(--prgb),.06));border:1px solid rgba(var(--wrgb),.3)}
.rest .num{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;min-width:74px}
.rest .bar{flex:1;margin:0}.rest .bar i{background:linear-gradient(90deg,var(--waterhi),var(--water));transition:width 1s linear}
.rest.done{animation:pop .5s var(--ease) 2}
.phbox{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:4/3;margin-top:10px}.phbox video,.phbox img{width:100%;height:100%;object-fit:cover;display:block}
.phbox .btn{position:absolute;left:50%;bottom:12px;transform:translateX(-50%)}
.g2b{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.g2b .btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 8px;overflow:hidden}
.fc{font-weight:700;color:var(--ink)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* Forma 2.5 — unified theme tokens */
:root{--water:#22b8cf;--water2:#1b8fd6;--waterhi:#5ef2d6;--fiber:#a98bff;--sugar:#ff7eb6;--salt:#9fb3c8;--prgb:77,155,255;--wrgb:34,184,207}
.card,.ex,.tcard,.kp>div,.sheet .bd{border-color:color-mix(in srgb,var(--acc) 18%,var(--line))}
.card,.tcard{box-shadow:0 5px 20px color-mix(in srgb,var(--bg) 70%,transparent)}
.chip.on,.tabs button.on{background:color-mix(in srgb,var(--acc) 22%,var(--card2));color:var(--ink);box-shadow:inset 0 0 0 1px var(--acc)}
.ico,.daynav,.tex i{background:color-mix(in srgb,var(--acc) 10%,var(--card2));color:var(--ink)}
.meal,.tcard,.rep,.nbar,.mrow{--m1:var(--acc2)!important;--m2:var(--accg)!important}
.meal .mic,.tcard .mic,.rep .mic,.nbar .mic{color:var(--onacc);background:linear-gradient(145deg,var(--acc),var(--accg));box-shadow:0 5px 15px rgba(var(--accrgb),.24)}
.tcard{min-height:166px;position:relative;background:radial-gradient(120% 100% at 0 0,rgba(var(--accrgb),.19),transparent 65%),linear-gradient(145deg,var(--c1),var(--c2))}
.tcard .mic{width:54px;height:54px;border-radius:17px}.tcard .mic svg{width:34px;height:34px}
.ex .exercise-mark,.item .exercise-mark{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:11px;background:rgba(var(--accrgb),.13);color:var(--acc2)}
.exercise-mark svg{width:25px;height:25px}
.wbtn{color:var(--onacc)}.tog.on{background:var(--acc)}.mrow.done .chk{background:var(--acc);border-color:var(--acc)}.chk svg{color:var(--onacc)}
input,select,textarea{accent-color:var(--acc)}::selection{background:var(--acc);color:var(--onacc)}

function trText(t){const k=t.trim();if(!k)return t;if(UI[k])return t.replace(k,UI[k]);let o=t;for(const[r,v]of PART)o=o.replace(r,v);return o}
function trNode(n){
  if(LANG!=='en')return;
  if(n.nodeType===3){const v=trText(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;return}
  if(n.nodeType!==1||n.tagName==='SCRIPT'||n.tagName==='STYLE')return;
  for(const a of ['placeholder','aria-label']){const v=n.getAttribute&&n.getAttribute(a);if(v){const t=trText(v);if(t!==v)n.setAttribute(a,t)}}
  const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);let c;
  while(c=w.nextNode()){if(c.nodeType===3){const v=trText(c.nodeValue);if(v!==c.nodeValue)c.nodeValue=v}else for(const a of ['placeholder','aria-label']){const v=c.getAttribute(a);if(v){const t=trText(v);if(t!==v)c.setAttribute(a,t)}}}
}
const trObs=new MutationObserver(ms=>{if(LANG!=='en')return;for(const m of ms){if(m.type==='characterData')trNode(m.target);else m.addedNodes.forEach(trNode)}});

function touch(key){saveLocal();if(!coll)return;dirty.add(key);clearTimeout(timer);timer=setTimeout(flush,600)}
function body(key){if(key==='main')return{profile:S.profile,custom:S.custom,weights:S.weights,meds:S.meds,rem:S.rem,sets:S.sets,recipes:S.recipes,review:S.review||null};const d=S.days[key.slice(2)]||EMPTY();return{food:d.food,ex:d.ex,water:d.water,mt:d.mt||{}}}
function flush(){
  const keys=[...dirty];dirty.clear();
  keys.forEach(k=>{const b=JSON.parse(JSON.stringify(body(k)));inflight.add(k);
    chain=chain.then(()=>coll.doc(k).set(b)).then(()=>{inflight.delete(k);setSync('ok')},e=>{inflight.delete(k);

}
function applyDocs(docs){
  let ch=false;
  docs.forEach(d=>{const k=d.id;if(dirty.has(k)||inflight.has(k)||!d.exists)return;const v=JSON.parse(JSON.stringify(d.data()||{}));
    if(k==='main'){const cur=JSON.stringify(body('main'));if(v.profile)S.profile=Object.assign(S.profile,v.profile);S.custom=Array.isArray(v.custom)?v.custom:[];S.weights=Array.isArray(v.weights)?v.weights:[];S.meds=Array.isArray(v.meds)?v.meds:[];S.rem=Array.isArray(v.rem)?v.rem:[];S.sets=Array.isArray(v.sets)?v.sets:[];S.recipes=Array.isArray(v.recipes)?v.recipes:[];S.review=v.review&&typeof v.review==='object'?v.review:null;if(cur!==JSON.stringify(body('main')))ch=true}
    else if(k.startsWith('d-')){const dk=k.slice(2),cur=JSON.stringify(body(k));S.days[dk]={food:Array.isArray(v.food)?v.food:[],ex:Array.isArray(v.ex)?v.ex:[],water:+v.water||0,mt:(v.mt&&typeof v.mt==='object')?v.mt:{}};if(cur!==JSON.stringify(body(k)))ch=true}});

  try{const r=await ai(prompt,{modelTier:'quick'});const t=r.text||'',a=t.indexOf('['),z=t.lastIndexOf(']');const arr=a>=0&&z>a?JSON.parse(t.slice(a,z+1)):[];
    const out=(Array.isArray(arr)?arr:[]).filter(o=>o&&Array.isArray(o.items)&&o.items.length).slice(0,3).map(o=>({t:String(o.t||'').slice(0,60),items:o.items.slice(0,4).filter(x=>x&&x.n&&num(x.g)>0).map(x=>{const n=String(x.n).slice(0,80),g=r0(num(x.g)),b=base[n]||FBYN[n];

let roW=null,roK=null;
function drawCharts(){
  const ws=$('#wSvg'),ks=$('#kSvg');if(!ws||!ks)return;
  const dw=()=>{if(ws.clientWidth<40)return;const W=ws.clientWidth,H=ws.clientHeight,pts=[...S.weights].sort((a,b)=>a.d<b.d?-1:1).slice(-30);
    if(pts.length<2){ws.innerHTML=`<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="var(--mut)" font-size="14">Запиши вагу хоча б 2 рази</text>`;return}
    const v=pts.map(p=>p.kg),mn=Math.min(...v)-0.5,mx=Math.max(...v)+0.5,L=36,R=10,Tp=12,B=24;
    const X=i=>L+i*(W-L-R)/(pts.length-1),Y=x=>Tp+(mx-x)/(mx-mn)*(H-Tp-B);
    const line=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.kg).toFixed(1)}`).join('');
    ws.innerHTML=[mn+0.5,(mn+mx)/2,mx-0.5].map(t=>`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(t)+4}" text-anchor="end" font-size="11" fill="var(--mut)">${r1(t)}</text>`).join('')
    +`<defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--acc)" stop-opacity=".35"/><stop offset="1" style="stop-color:var(--acc)" stop-opacity="0"/></linearGradient></defs><path d="${line}L${X(pts.length-1)},${H-B}L${X(0)},${H-B}Z" fill="url(#wg)"/><path d="${line}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>`+pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.kg)}" r="3.5" fill="var(--acc)"/>`).join('')
    +`<text x="${L}" y="${H-6}" font-size="11" fill="var(--mut)">${esc(fmtD(pts[0].d))}</text><text x="${W-R}" y="${H-6}" font-size="11" text-anchor="end" fill="var(--mut)">${esc(fmtD(pts[pts.length-1].d))}</text>`};
  const dk=()=>{if(ks.clientWidth<40)return;const W=ks.clientWidth,H=ks.clientHeight,T=targets().kcal,days=Array.from({length:7},(_,i)=>addDays(today(),i-6)),v=days.map(k=>sum(day(k).food).k);
    const mx=Math.max(T*1.25,...v),B=22,Tp=8,bw=(W-12)/7;const Y=x=>Tp+(1-x/mx)*(H-Tp-B);
    ks.innerHTML=days.map((k,i)=>{const x=6+i*bw+bw*.18,w=bw*.64,y=Y(v[i]);return`<rect x="${x}" y="${y}" width="${w}" height="${Math.max(0,H-B-y)}" rx="6" fill="${v[i]>T*1.05?'var(--acc)':'var(--ok)'}" opacity="${k===today()?1:.75}"/><text x="${x+w/2}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--mut)">${esc(toDate(k).toLocaleDateString(loc(),{weekday:'short'}))}</text>`}).join('')
    +`<line x1="4" x2="${W-4}" y1="${Y(T)}" y2="${Y(T)}" stroke="var(--ink)" stroke-dasharray="4 4" opacity=".5"/>`};
  roW&&roW.disconnect();roK&&roK.disconnect();roW=new ResizeObserver(dw);roW.observe(ws);roK=new ResizeObserver(dk);roK.observe(ks);
}

async function gemini(prompt,opts){
  const img=opts&&opts.image?String(opts.image).replace(/^data:[^,]*,/,''):'';
  if(!img&&AICACHE[prompt])return{text:AICACHE[prompt]};
  let best='';try{best=localStorage.getItem('forma.gmodel')||''}catch(e){}
  const list=[...GMODELS].sort((a,b)=>(b[0]===best)-(a[0]===best));
  let last=null;
  for(const[m,th]of list){
    if(opts&&opts.signal&&opts.signal.aborted)throw{name:'AbortError'};
    const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),img?30000:15000);
    const onAb=()=>ctl.abort();if(opts&&opts.signal)opts.signal.addEventListener('abort',onAb);
    const gc={temperature:0.2,responseMimeType:'application/json',maxOutputTokens:1200};if(th)gc.thinkingConfig=th;
    let r;
    try{r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent',{method:'POST',signal:ctl.signal,headers:{'Content-Type':'application/json','x-goog-api-key':GK},body:JSON.stringify({contents:[{role:'user',parts:img?[{inline_data:{mime_type:'image/jpeg',data:img}},{text:prompt}]:[{text:prompt}]}],generationConfig:gc})})}
    catch(e){clearTimeout(tm);if(opts&&opts.signal&&opts.signal.aborted)throw{name:'AbortError'};if(ctl.signal.aborted){last={code:'busy'};continue}throw{code:'offline'}}
    finally{if(opts&&opts.signal)opts.signal.removeEventListener('abort',onAb)}
    clearTimeout(tm);

      last={code:r.status===429?'rate_limited':'api',msg:'HTTP '+r.status+(msg?': '+msg:'')};
      if(r.status>=500)last.code='busy';
      if(/API_KEY_INVALID|API key not valid/i.test(msg)){last.code='bad_key';throw last}
      if([400,401,403,404,429].includes(r.status)||r.status>=500)continue;throw last}
    const j=await r.json();const t=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts||[]).filter(p=>!p.thought).map(p=>p.text||'').join('');
    if(!t.trim()){last={code:'err'};continue}
    try{localStorage.setItem('forma.gmodel',m)}catch(e){}
    if(!img)AICACHE[prompt]=t;return{text:t};
  }
  throw last||{code:'err'};
}

// темп і прогноз ваги
function trend(){
  const cut=addDays(today(),-60),w=[...S.weights].filter(x=>x.d>=cut).sort((a,b)=>a.d<b.d?-1:1);if(w.length<2)return null;
  const t0=toDate(w[0].d).getTime(),xs=w.map(x=>(toDate(x.d).getTime()-t0)/864e5),ys=w.map(x=>+x.kg),span=xs[xs.length-1];if(span<5)return null;
  const n=xs.length,mx=xs.reduce((a,b)=>a+b,0)/n,my=ys.reduce((a,b)=>a+b,0)/n;let nu=0,de=0;for(let i=0;i<n;i++){nu+=(xs[i]-mx)*(ys[i]-my);de+=(xs[i]-mx)**2}
  const sl=de?nu/de:0;return{sl,wk:sl*7,now:my+sl*(span-mx)};
}
function forecastHTML(){
  const tw=+S.profile.tw||0,t=trend();
  if(!t)return`<div class="hint" style="margin-top:10px">${S.weights.length?'Мало записів для прогнозу. Записуй вагу хоча б раз на тиждень.':''}</div>`;
  const wk=r1(t.wk);let f='—',fl='прогноз';
  if(tw){const diff=tw-t.now;if(Math.abs(diff)<0.3)f='Ціль досягнута!';else if(t.sl*diff>0&&Math.abs(t.sl)>0.003){const dd=Math.round(diff/t.sl);if(dd<=730){const dt=toDate(addDays(today(),dd));f=dt.toLocaleDateString(loc(),{day:'numeric',month:'short',...(dt.getFullYear()!==new Date().getFullYear()?{year:'numeric'}:{})});fl='до '+r1(tw)+' кг'}else f='далеко'}else f='вага йде не в той бік'}
  return`<div class="kp"><div><b>${wk>0?'+':''}${wk}</b><span class="sm mut">кг/тижд.</span></div><div><b>${tw?r1(tw)+' кг':'—'}</b><span class="sm mut">бажана вага</span></div><div><b style="font-size:${f.length>9?'14px':''}">${esc(f)}</b><span class="sm mut">${esc(fl)}</span></div></div>${tw?'':'<div class="hint">Задай бажану вагу в Профілі, і тут буде прогноз.</div>'}${plateauHTML()}`;
}

function plateauHTML(){const g=S.profile.goal;if(g==='keep')return'';
  const w=S.weights.filter(x=>x.d>=addDays(today(),-24)).sort((a,b)=>a.d<b.d?-1:1);if(w.length<3)return'';
  const span=(toDate(w[w.length-1].d)-toDate(w[0].d))/864e5,v=w.map(x=>+x.kg);if(span<18||Math.max(...v)-Math.min(...v)>0.7)return'';
  return`<div class="plat"><b>Вага стоїть уже ~3 тижні</b><div class="sm">${g==='lose'?'Таке буває. Спробуй з’їдати на 150–200 ккал менше або більше ходити. І перевір, чи записуєш олію, соуси й напої.':'Організму не вистачає енергії на ріст. Додай ~200 ккал на день: склянку молока й жменю горіхів.'}</div></div>`}

async function lookupCode(code){

  out.innerHTML='<div class="empty">Шукаю…</div>';
  try{
    const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'?fields=product_name,product_name_uk,product_name_en,brands,nutriments,serving_quantity,product_quantity_unit,quantity');
    const j=r.ok?await r.json():null;const p=j&&j.status===1&&j.product;
    if(!p){if($('#bcR'))$('#bcR').innerHTML='<div class="empty">Продукт не знайдено в базі. Додай його через «Своє».</div>'+(canPhoto()&&GK?`<button class="btn sec w" style="margin-top:8px" data-lblgo="${esc(code)}">${I.cam} Сфотографувати етикетку</button>`:'');return}
    const nu=p.nutriments||{};let k=num(nu['energy-kcal_100g']);if(!k&&nu.energy_100g)k=num(nu.energy_100g)/4.184;
    const name=((LANG==='en'?p.product_name_en:p.product_name_uk)||p.product_name||p.product_name_en||code)+(p.brands?' ('+String(p.brands).split(',')[0]+')':'');

    const f={id:nid(),code,n:String(name).slice(0,80),k:r1(k),p:r1(num(nu.proteins_100g)),f:r1(num(nu.fat_100g)),c:r1(num(nu.carbohydrates_100g)),fb:r1(num(nu.fiber_100g)),sg:r1(num(nu.sugars_100g)),sl:r1(num(nu.salt_100g)||num(nu.sodium_100g)*2.5),u:num(p.serving_quantity)||0,un:'порція',...((String(p.product_quantity_unit||'').toLowerCase()==='ml'||/\d\s*(ml|мл|l|л)\b/i.test(String(p.quantity||'')))?{l:1}:{})};
    S.custom.unshift(f);touch('main');portion(f);

  }catch(e){if($('#bcR'))$('#bcR').innerHTML='<div class="empty">Не вдалося знайти — перевір інтернет.</div>'}
}

  const box=document.createElement('div');box.className='confetti';const cols=['#ff5a36','#ffb03b','#4d9bff','#34d39e','#ff6fa5','#8b7bff','#5ef2d6'];

}

document.addEventListener('input',e=>{
  const t=e.target,ds=t.dataset;
  if(ds.en!==undefined)W.ex[+ds.en].n=t.value;
  if(ds.sr){const[i,j]=ds.sr.split('.').map(Number);W.ex[i].sets[j].r=t.value}
  if(ds.sw){const[i,j]=ds.sw.split('.').map(Number);W.ex[i].sets[j].w=t.value}
  if(ds.wf)W[ds.wf]=t.value;
  if(ds.rcg!==undefined||t.id==='rcOut'||t.id==='rcP'){recRead();recSum()}
});
document.addEventListener('change',e=>{
  const t=e.target,k=t.dataset.pf;if(!k)return;const p=S.profile;
  if(k==='sex')p.sex=t.value;else if(k==='act')p.act=+t.value;
  else if(k==='w'){const kg=num(t.value);if(kg>=25&&kg<=350){p.w=r1(kg);const td=today();S.weights=S.weights.filter(x=>x.d!==td);S.weights.push({d:td,kg:p.w})}}
  else if(k==='tw'){const v=num(t.value);p.tw=v>=25&&v<=350?r1(v):0}
  else if(k==='bf'){const v=num(t.value);p.bf=v>2&&v<70?r1(v):0}
  else{const v=num(t.value);if(k==='kcal')p.kcal=v>=800?r0(v):0;else if(v>0)p[k]=r0(v)}
  p.set=true;touch('main');render();
});

async function runAI(){
  const txt=$('#aiT').value.trim(),ph=canPhoto()?PH:null;if(!txt&&!ph){toast('Опиши, що з’їв');return}
  const s=ph?(GK?gemini:null):await getAI();const out=$('#aiR'),btn=$('#aiB');
  if(!s){out.innerHTML='<div class="empty">'+(window.claude?'ШІ тут недоступний.':'Встав ключ Gemini в Налаштуваннях.')+'</div>';return}
  btn.disabled=true;btn.textContent='Рахую…';const t0=Date.now();const tick=setInterval(()=>{if(btn.isConnected)btn.textContent='Рахую… '+Math.round((Date.now()-t0)/1000)+' с';else clearInterval(tick)},1000);out.innerHTML='';
  aiCtl&&aiCtl.abort();aiCtl=new AbortController();
  let prompt=LANG==='en'?`You are a nutritionist. The user described what they ate. Split it into separate foods or dishes; for each, estimate a realistic portion weight in grams and the calories and macros for that portion. Reply ONLY with a JSON array, no explanations, in the format: [{"n":"name in English","g":grams,"k":kcal,"p":protein_g,"f":fat_g,"c":carbs_g,"fb":fibre_g,"sg":sugar_g,"sl":salt_g}]. For drinks (milk, juice, coffee, tea, soda, alcohol, etc.) put millilitres in g and add "l":true. Numbers without units.\nDescription: ${txt}`:`Ти нутриціолог. Користувач описав, що з'їв. Розбий опис на окремі продукти або страви, для кожного оціни реалістичну вагу порції в грамах і калорійність та БЖВ саме на цю порцію (типові українські порції). Відповідай ТІЛЬКИ JSON-масивом без пояснень, у форматі: [{"n":"назва українською","g":грами,"k":ккал,"p":білки_г,"f":жири_г,"c":вуглеводи_г,"fb":клітковина_г,"sg":цукор_г,"sl":сіль_г}]. Для напоїв (молоко, сік, кава, чай, газування, алкоголь тощо) у полі g вкажи мілілітри і додай "l":true. Числа — без одиниць.\nОпис: ${txt}`;
  try{
    if(ph)prompt=(LANG==='en'?'The photo shows food the user ate. Recognise every food or drink on it and estimate realistic portion weights from the plate size. ':'На фото їжа, яку з’їв користувач. Розпізнай кожну страву чи напій і оціни реалістичну вагу порції за розміром тарілки. ')+prompt.replace(/\n(Description|Опис): $/,'\n$1: '+(LANG==='en'?'(see photo)':'(див. фото)'));
    const r=await s(prompt,{signal:aiCtl.signal,modelTier:'quick',...(ph?{image:ph}:{})});
    const t=r.text||'',a=t.indexOf('['),z=t.lastIndexOf(']');
    const arr=a>=0&&z>a?JSON.parse(t.slice(a,z+1)):[];
    AIres=(Array.isArray(arr)?arr:[]).filter(x=>x&&x.n).slice(0,20).map(x=>({n:String(x.n).slice(0,80),g:r0(num(x.g)),k:r0(num(x.k)),p:r1(num(x.p)),f:r1(num(x.f)),c:r1(num(x.c)),fb:r1(num(x.fb)),sg:r1(num(x.sg)),sl:r1(num(x.sl)),...(x.l?{l:1}:{})}));
    if(!AIres.length){out.innerHTML='<div class="empty">Не вдалося розібрати. Спробуй написати простіше.</div>'}
    else{const tot=sum(AIres);out.innerHTML=`<div class="card">${AIres.map((x,i)=>`<label class="item" style="margin:0;color:var(--ink);font-size:16px"><input type="checkbox" checked data-aichk="${i}" style="width:22px;min-height:22px;flex:none"><div class="grow"><div class="nm">${esc(x.n)}</div><div class="sm mut">${x.g} ${U(x)} · Б ${x.p} Ж ${x.f} В ${x.c}</div></div><span class="k">${x.k}</span></label>`).join('')}
      <div class="row sp" style="margin-top:8px"><b>Разом</b><span class="k num">${r0(tot.k)} ккал</span></div><div class="hint">Це приблизна оцінка ШІ.</div></div><button class="btn w" style="margin-top:10px" data-aiadd="1">Додати вибране</button>`}
  }catch(e){
    if(e&&e.name==='AbortError')return;
    out.innerHTML=`<div class="empty">${e&&e.code==='busy'?'Сервери Gemini зараз перевантажені, спробуй ще раз за хвилину.':e&&e.code==='rate_limited'?'Забагато запитів, спробуй за хвилину.':e&&e.code==='not_granted'?'Доступ до ШІ не надано.':e&&e.code==='bad_key'?'Ключ не підходить — перевір його в Налаштуваннях.':e&&e.code==='offline'?'Немає інтернету.':e&&e.code==='api'?'Помилка: '+esc(String(e.msg).slice(0,220)):'Не вийшло порахувати, спробуй ще раз.'}</div>`;
  }finally{clearInterval(tick);if(btn){btn.disabled=false;btn.textContent='Порахувати'}}
}

window.forBack=()=>{if(!sheet.classList.contains('hidden')){closeSheet();return true}if(tab!=='today'){tab='today';render();return true}return false};
setTimeout(syncNative,300);
if(!S.profile.set)tab='today';
render();
}
</script>
