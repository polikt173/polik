<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0b0c0e">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Форма — треня і харчування</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: коротко, як табло в залі — цифра головна, решта тихо
   IDEA: щоденник атлета + табло калорій
   PICTURE: велике градієнтне кільце «залишилось ккал» з макро-смугами
   COLOUR and TYPE: нічний зал — графіт, крейда, гарячий помаранчевий; Archivo для цифр, Manrope для тексту
   LAYOUT: одна колонка під телефон, нижня навігація, шторки знизу */
:root{color-scheme:dark;--bg:#0b0c0e;--card:#15161a;--card2:#202127;--ink:#f4f2ee;--mut:#8e8c88;--line:#24252b;
--acc:#ff5a36;--acc2:#ff7d5c;--amb:#ffb03b;--p:#4d9bff;--f:#ffc23d;--c:#34d39e;--ok:#34d39e;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 Manrope,system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(92px + env(safe-area-inset-bottom));
background:radial-gradient(900px 420px at 50% -180px,rgba(255,90,54,.16),transparent 70%) no-repeat,var(--bg)}
.wrap{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px 16px}
h1,h2,h3,.num{font-family:Archivo,system-ui,sans-serif;margin:0;letter-spacing:-.01em}
h1{font-size:32px;line-height:1.05;font-weight:800;margin:6px 0 4px}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
.mut{color:var(--mut)}.sm{font-size:13px}
.card{background:linear-gradient(180deg,#18191d,#141518);border:1px solid var(--line);border-radius:20px;padding:14px;margin-top:12px;overflow:hidden;overflow-wrap:anywhere}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.row>.btn,.row>.ico{flex:none}
.grow{flex:1;min-width:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;transition:transform .14s var(--ease),background .2s,color .2s,opacity .2s}
button:active{transform:scale(.96)}
button:disabled{opacity:.5}
.btn{min-height:46px;padding:10px 16px;border-radius:14px;background:linear-gradient(135deg,var(--acc),#ff7a3d);color:#fff;font-weight:700;box-shadow:0 6px 18px rgba(255,90,54,.25);white-space:nowrap}
.btn.sec{background:var(--card2);color:var(--ink);box-shadow:none}
.btn.dang{background:rgba(255,90,54,.12);color:var(--acc2);box-shadow:none}
.btn.w{width:100%}
.ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--card2)}
.ico svg{width:20px;height:20px}
input,select,textarea{font:16px Manrope,system-ui,sans-serif;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;width:100%;transition:border-color .2s,box-shadow .2s}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,90,54,.18)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{min-height:38px;padding:8px 11px;border-radius:999px;background:var(--card2);font-size:13.5px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg)}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datebar .t{text-align:center;flex:1;min-width:0}
.sync{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;background:var(--mut);flex:none;border-radius:50%}
.dot.ok{background:var(--ok)}.dot.err{background:var(--acc)}
.hero{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:150px;height:150px;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:0 18px}
.ring .big{font-family:Archivo,system-ui,sans-serif;font-weight:800;font-size:clamp(26px,8vw,34px);line-height:1;white-space:nowrap}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;padding:5px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border:0}
.stat b{font-family:Archivo,system-ui,sans-serif;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:8px;border-radius:9px;background:var(--card2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:9px;transform-origin:left;transition:width .9s cubic-bezier(.3,.9,.3,1)}
.macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.mv{font-family:Archivo,system-ui,sans-serif;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mv span{color:var(--mut);font-size:12px}.xtra{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.xtra .mv{font-size:14px}.xtra .bar{height:6px}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
h3+.item,.item:first-child{border-top:0}
.item .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .k,.k{font-family:Archivo,system-ui,sans-serif;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;flex:none}
.x{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mut);flex:none}
.x:hover{background:var(--card2)}
.add{display:flex;align-items:center;gap:6px;color:var(--acc2);font-weight:700;min-height:42px;margin-top:2px}
.water{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.water i{width:22px;height:28px;border-radius:4px 4px 9px 9px;border:2px solid rgba(77,155,255,.5);display:block;transition:background .3s var(--ease),transform .3s var(--ease)}
.water i.on{background:linear-gradient(180deg,#7ab6ff,var(--p));border-color:var(--p)}
.water i.pop{animation:pop .4s var(--ease)}
@keyframes pop{50%{transform:scale(1.25)}}
.banner{background:linear-gradient(135deg,var(--acc),#ff8a3d);color:#fff;border-radius:20px;padding:16px;margin-top:12px}
.banner .btn{background:#fff;color:var(--acc);margin-top:10px;box-shadow:none}
.empty{color:var(--mut);font-size:14px;padding:6px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(17,18,21,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--mut);min-height:54px;justify-content:center;white-space:nowrap;overflow:hidden}
nav button span.p{display:grid;place-items:center;width:52px;height:30px;border-radius:999px;transition:background .25s var(--ease)}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--acc2)}
nav button.on span.p{background:rgba(255,90,54,.16)}
.sheet{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden{display:none}
.sheet .bg{position:absolute;inset:0;background:rgba(0,0,0,.6);animation:fade .25s ease both}
.sheet .bd{position:relative;background:#111215;border:1px solid var(--line);border-bottom:0;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:12px 14px calc(18px + env(safe-area-inset-bottom));animation:up .34s var(--ease) both}
.sheet.closing .bg{animation:fade .22s ease reverse both}
.sheet.closing .bd{animation:down .22s ease-in both}
@keyframes up{from{transform:translateY(100%)}}
@keyframes down{to{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
.grab{width:40px;height:5px;border-radius:9px;background:#33343a;margin:0 auto 12px}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--card2);border-radius:13px;padding:3px;margin:12px 0}
.tabs button{min-height:40px;border-radius:10px;font-weight:700;font-size:14px}
.tabs button.on{background:#2e2f36}
.res{max-height:48vh;overflow:auto}
.res .item{cursor:pointer}
.big2{font-family:Archivo,system-ui,sans-serif;font-weight:800;font-size:40px;line-height:1}
.set{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) 36px;gap:6px;align-items:center;margin-top:6px}
.set input{min-height:40px;padding:8px;text-align:center}
.ex{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin-top:10px}
.hint{font-size:12px;color:var(--mut);margin-top:4px}
.fig{position:relative;height:190px;margin-top:8px}.fig svg{position:absolute;inset:0;width:100%;height:100%}
.kp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.kp div{background:var(--card2);border-radius:14px;padding:10px;min-width:0}
.kp b{font-family:Archivo,system-ui,sans-serif;font-size:clamp(16px,5.2vw,21px);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kp span{display:block;line-height:1.25}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;z-index:20;font-size:14px;animation:tin .3s var(--ease);max-width:90vw;text-align:center}
@keyframes tin{from{opacity:0;transform:translate(-50%,12px)}}
.anim>*{animation:rise .45s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.anim .arc{animation:ring 1s var(--ease) .1s both}
@keyframes ring{from{stroke-dashoffset:var(--c)}}
.anim .bar i{animation:grow .8s var(--ease) .2s both}
@keyframes grow{from{transform:scaleX(0)}}
.fadein{animation:fade .25s ease both}
.scanbox{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:4/3;margin-top:4px}.scanbox video{width:100%;height:100%;object-fit:cover;display:block;background:#000}.scanwait{position:absolute;inset:0;display:grid;place-items:center;color:#cfcfcf;font-size:14px;pointer-events:none}.scanline{position:absolute;left:10%;right:10%;top:50%;height:2px;background:var(--acc);box-shadow:0 0 12px var(--acc);animation:scan 1.6s ease-in-out infinite alternate}@keyframes scan{from{transform:translateY(-60px)}to{transform:translateY(60px)}}
.sec-t{font-size:13px;color:var(--mut);font-weight:700;margin:18px 2px 0}
@media(max-width:380px){.hero{grid-template-columns:120px minmax(0,1fr);gap:12px}.ring,.ring svg{width:120px;height:120px}.macros{gap:8px}}
.top{display:flex;align-items:center;gap:10px}.top h1{margin:2px 0 0}
.streak{display:flex;align-items:center;gap:4px;background:rgba(255,140,50,.12);border:1px solid rgba(255,140,50,.3);border-radius:999px;padding:6px 12px 6px 8px;font-family:Archivo,system-ui,sans-serif;font-size:17px;flex:none}
.streak svg{width:20px;height:20px;animation:flick 1.6s ease-in-out infinite alternate}
@keyframes flick{to{transform:scale(1.12) rotate(-4deg)}}
.daynav{display:flex;align-items:center;justify-content:space-between;background:var(--card2);border-radius:999px;margin-top:12px;padding:3px}
.daynav button{width:40px;height:38px;border-radius:999px;display:grid;place-items:center}.daynav button svg{width:18px;height:18px}
.daynav span{font-weight:700;font-size:14px}
.hero2{display:block;background:radial-gradient(120% 90% at 0% 0%,rgba(255,122,61,.14),transparent 60%),radial-gradient(90% 80% at 100% 0%,rgba(77,155,255,.12),transparent 60%),linear-gradient(180deg,#18191d,#141518)}
.hero2>.rings{float:left;margin-right:14px}
.rings{position:relative;width:168px;height:168px}.rings svg{width:168px;height:168px;transform:rotate(-90deg);filter:drop-shadow(0 0 10px rgba(255,110,60,.18))}
.rings .in{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rings .big{font-family:Archivo,system-ui,sans-serif;font-weight:800;font-size:25px;line-height:1}.rings .in .sm{font-size:11px}
.legend{display:grid;gap:10px;padding-top:12px}
.legend div{display:grid;grid-template-columns:10px minmax(0,1fr);column-gap:8px;align-items:center}
.legend i{width:10px;height:10px;border-radius:50%;grid-row:span 2}
.legend span{font-size:12px}.legend b{font-family:Archivo,system-ui,sans-serif;font-size:18px;white-space:nowrap}.legend small{font-size:12px;color:var(--mut);font-weight:500}
.legend .burn{display:block;font-size:12px;color:var(--amb);font-weight:700}
.hero2 .macros{clear:both;padding-top:6px}
.wcard{display:flex;align-items:center;gap:16px;background:radial-gradient(100% 120% at 0% 100%,rgba(34,184,207,.16),transparent 60%),linear-gradient(180deg,#18191d,#141518)}
.glass{width:60px;height:80px;flex:none}
.wave{transition:transform 1.1s cubic-bezier(.3,.9,.3,1)}.wave .w1{animation:wave 2.6s linear infinite}.wave .w2{animation:wave 3.8s linear infinite reverse}.arc.sm2{transition:stroke-dashoffset 1s cubic-bezier(.3,.9,.3,1)}
@keyframes wave{to{transform:translateX(60px)}}
.wbtn{background:linear-gradient(135deg,#22b8cf,#1b8fd6);box-shadow:0 6px 18px rgba(34,184,207,.25);flex:1}
.meal{background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--m1) 14%,transparent),transparent 55%),linear-gradient(180deg,#18191d,#141518)}
.mic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--m1),var(--m2));box-shadow:0 6px 16px color-mix(in srgb,var(--m1) 35%,transparent);flex:none}
.mic svg{width:22px;height:22px}
.plus{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--m1) 18%,transparent);color:var(--m1);flex:none}
.plus svg{width:20px;height:20px}
.mlist{margin-top:8px;border-top:1px solid var(--line)}
.tip{border-color:rgba(255,176,59,.25);background:linear-gradient(135deg,rgba(255,176,59,.1),rgba(255,90,54,.04))}
nav .in{grid-template-columns:repeat(5,minmax(0,1fr))!important}
nav .fab{overflow:visible}
nav .fab span{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#ff5a36,#ffb03b);box-shadow:0 8px 24px rgba(255,90,54,.45),0 0 0 5px var(--bg);transform:translateY(-16px)}
nav .fab svg{width:26px;height:26px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
.confetti i{position:absolute;bottom:22%;width:8px;height:12px;border-radius:2px;animation:conf 1.4s cubic-bezier(.2,.7,.4,1) both}
@keyframes conf{0%{transform:translate(0,0) rotate(0);opacity:1}70%{opacity:1}100%{transform:translate(var(--x),calc(var(--y) + 260px)) rotate(var(--r));opacity:0}}
@media(max-width:380px){.rings,.rings svg{width:146px;height:146px}.rings .big{font-size:22px}.rings .in .sm{font-size:10px}.legend b{font-size:16px}}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.tcard{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px;border-radius:20px;border:1px solid var(--line);background:radial-gradient(120% 120% at 0% 0%,color-mix(in srgb,var(--m1) 22%,transparent),transparent 60%),#16171b;min-height:150px;overflow:hidden;width:100%}
.tcard b{font-family:Archivo,system-ui,sans-serif;font-size:16px;line-height:1.15;margin-top:4px}
.tcard .mic{width:40px;height:40px;border-radius:13px}
.tex{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto;width:100%}.tex i{font-style:normal;font-size:11px;line-height:1.2;padding:3px 7px;border-radius:999px;background:rgba(255,255,255,.06);color:#c9c7c2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rep{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:12px;padding:14px;border-radius:20px;border:1px solid rgba(255,140,50,.35);background:linear-gradient(135deg,rgba(255,176,59,.14),rgba(255,90,54,.06))}
.rep b{display:block;font-family:Archivo,system-ui,sans-serif;font-size:17px}.rep .sm{display:block}.rep>svg{width:20px;height:20px;color:var(--mut);flex:none}
.tempty{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;margin-top:10px;border-radius:16px;border:1.5px dashed #3a3b42;color:var(--mut);font-weight:700}
.tempty svg{width:18px;height:18px}
.mrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}.mrow b{display:block;font-size:15px}.mrow .sm{display:block}
.mt{font-family:Archivo,system-ui,sans-serif;font-weight:700;font-size:15px;min-width:46px;color:var(--ink);font-variant-numeric:tabular-nums}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid #3a3b42;display:grid;place-items:center;flex:none;transition:all .25s var(--ease)}
.chk svg{width:16px;height:16px;opacity:0;transform:scale(.4);transition:all .25s var(--ease);color:#fff}
.mrow.done .chk{background:var(--m1);border-color:var(--m1)}.mrow.done .chk svg{opacity:1;transform:none}
.mrow.done b{text-decoration:line-through;color:var(--mut)}
.rdot{width:10px;height:10px;border-radius:50%;flex:none}
.tog{width:44px;height:26px;border-radius:999px;background:#3a3b42;position:relative;flex:none}
.tog i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .25s var(--ease)}
.tog.on{background:var(--ok)}.tog.on i{transform:translateX(18px)}
.nbar{display:flex;align-items:center;gap:12px;border-color:rgba(255,176,59,.3)}.nbar .mic{color:#fff}.nbar .mic svg{width:22px;height:22px}
.inf{padding:8px 0;border-top:1px solid var(--line)}.inf:first-child{border-top:0}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<body>
<div class="wrap" id="view"></div>
<nav><div class="in" id="nav"></div></nav>
<div class="sheet hidden" id="sheet"><div class="bg" id="sheetBg"></div><div class="bd" id="sheetBd"></div></div>
<div class="toast" id="toast" hidden></div>
<script>
{
try{if(window.Mig&&Mig.has()){const d=Mig.data(),k=Mig.key();if(d&&!localStorage.getItem('forma.v1'))localStorage.setItem('forma.v1',d);if(k&&!localStorage.getItem('forma.gkey'))localStorage.setItem('forma.gkey',k);Mig.clear()}}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r0=n=>Math.round(+n||0), r1=n=>Math.round((+n||0)*10)/10, num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dkey(new Date());
const toDate=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=toDate(k);d.setDate(d.getDate()+n);return dkey(d)};

function trText(t){const k=t.trim();if(!k)return t;if(UI[k])return t.replace(k,UI[k]);let o=t;for(const[r,v]of PART)o=o.replace(r,v);return o}
function trNode(n){
  if(LANG!=='en')return;
  if(n.nodeType===3){const v=trText(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;return}
  if(n.nodeType!==1||n.tagName==='SCRIPT'||n.tagName==='STYLE')return;
  for(const a of ['placeholder','aria-label']){const v=n.getAttribute&&n.getAttribute(a);if(v){const t=trText(v);if(t!==v)n.setAttribute(a,t)}}
  const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);let c;
  while(c=w.nextNode()){if(c.nodeType===3){const v=trText(c.nodeValue);if(v!==c.nodeValue)c.nodeValue=v}else for(const a of ['placeholder','aria-label']){const v=c.getAttribute(a);if(v){const t=trText(v);if(t!==v)c.setAttribute(a,t)}}}
}

function applyDocs(docs){

  const prot=r0(w*(p.goal==='keep'?1.6:2)),fat=r0(w*.9),carb=Math.max(0,r0((kcal-prot*4-fat*9)/4));
  return{bmr:r0(bmr),tdee:r0(tdee),kcal,prot,fat,carb,water:p.water||8,fib:p.sex==='f'?25:30,sug:Math.round(90*kcal/2000/5)*5,salt:5};
}

async function gemini(prompt,opts){

      last={code:r.status===429?'rate_limited':'api',msg:'HTTP '+r.status+(msg?': '+msg:'')};
      if(r.status>=500)last.code='busy';
      if(/API_KEY_INVALID|API key not valid/i.test(msg)){last.code='bad_key';throw last}

    if(!t.trim()){last={code:'err'};continue}

}

  document.body.appendChild(box);setTimeout(()=>box.remove(),1600);
}
function goalSnap(){const d=day(cur),s=sum(d.food),T=targets();return{p:s.p>=T.prot,w:liquid(d).tot>=T.water*250,f:s.fb>=T.fib}}
function goalCheck(b){const a=goalSnap();if(!b.p&&a.p)celebrate('Норма білка виконана!');else if(!b.w&&a.w)celebrate('Норма води виконана!');else if(!b.f&&a.f)celebrate('Норма клітковини виконана!')}

// ---------- події ----------
document.addEventListener('click',e=>{

  if(ds.madd){medSheet(null);return}

  if(ds.mpre!==undefined){const p=MPRESETS[+ds.mpre];readMed();ME.n=p[0];ME.type=p[1];ME.info=p[2];ME.infoAI=0;medSheet(ME);ME.id=ME.id;return}

  if(ds.mdel){S.meds=S.meds.filter(x=>x.id!==ME.id);touch('main');syncNative();toast('Видалено');closeSheet();return}
  if(ds.minfo){infoSheet(ds.minfo);return}
  if(ds.minforef){const m=S.meds.find(x=>x.id===ds.minforef);if(m){m.info=null;infoSheet(m.id)}return}
  if(ds.radd){remSheet(null);return}
  if(ds.redit){const r=S.rem.find(x=>x.id===ds.redit);if(r)remSheet(r);return}
  if(ds.rkind){RE.kind=ds.rkind;sbd.querySelectorAll('[data-rkind]').forEach(x=>x.classList.toggle('on',x.dataset.rkind===RE.kind));return}
  if(ds.rsave){RE.t=$('#rT').value||'08:00';RE.text=$('#rX').value.trim()||(LANG==='en'?'Reminder':'Нагадування');const i=S.rem.findIndex(x=>x.id===RE.id);if(i>=0)S.rem[i]=RE;else S.rem.push(RE);touch('main');syncNative();toast('Збережено');closeSheet();return}
  if(ds.rdel){S.rem=S.rem.filter(x=>x.id!==RE.id);touch('main');syncNative();toast('Видалено');closeSheet();return}
  if(ds.rtog){const r=S.rem.find(x=>x.id===ds.rtog);if(r){r.on=r.on===false;touch('main');syncNative();render()}return}
  if(ds.rquick){const[t,tx2,k]=ds.rquick.split('|');S.rem.push({id:nid(),t,text:(LANG==='en'?trText(tx2):tx2),kind:k,on:true});touch('main');syncNative();toast('Нагадування додано');render();return}
  if(ds.notif){try{Native.requestNotif()}catch(e){}return}
  if(ds.fab){const h=new Date().getHours();FM=h<11?'b':h<16?'l':h<21?'d':'s';FT='find';foodSheet();return}
  if(ds.day){cur=addDays(cur,+ds.day);anim=true;render();return}
  if(ds.water){const g0=goalSnap();setTimeout(()=>goalCheck(g0),50);const d=dayW(cur);d.water=Math.max(0,d.water+ +ds.water);touch('d-'+cur);render();const g=document.querySelectorAll('.water i')[Math.max(0,d.water-(+ds.water>0?1:0))];g&&g.classList.add('pop');return}
  if(ds.reset){if(!resetArm){resetArm=true;render();return}resetArm=false;const keys=Object.keys(S.days);S.days={};S.custom=[];S.weights=[];S.meds=[];S.rem=[];syncNative();S.profile={set:false,sex:'m',age:20,h:178,w:75,act:1.55,goal:'keep',water:8,kcal:0};saveLocal();if(coll){keys.forEach(k=>{chain=chain.then(()=>coll.doc('d-'+k).delete()).catch(()=>{})});touch('main')}toast('Дані стерто');tab='today';anim=true;render();return}
  if(ds.delfood){const d=dayW(cur);d.food=d.food.filter(f=>f.id!==ds.delfood);touch('d-'+cur);render();return}
  if(ds.addfood){FM=ds.addfood;FT='find';foodSheet();return}
  if(ds.close){closeSheet();return}
  if(ds.fm){FM=ds.fm;sbd.querySelectorAll('[data-fm]').forEach(x=>x.classList.toggle('on',x.dataset.fm===FM));return}
  if(ds.fm2){FM=ds.fm2;sbd.querySelectorAll('[data-fm2]').forEach(x=>x.classList.toggle('on',x.dataset.fm2===FM));return}
  if(ds.ft){FT=ds.ft;foodSheet();if(FT==='ai')getAI().then(s=>{if(!s&&$('#aiR')){$('#aiB').disabled=true;$('#aiR').innerHTML=window.claude?'<div class="empty">ШІ тут недоступний — скористайся пошуком або «Своє».</div>':'<div class="empty">Щоб ШІ працював, встав ключ Gemini в Налаштуваннях.</div><button class="btn sec w" data-tab="set">Відкрити налаштування</button>'}});return}
  if(ds.savekey){const k=$('#gk').value.trim();if(k.length<20){toast('Ключ закороткий');return}setGkey(k);toast('Ключ збережено');render();return}
  if(ds.delkey){setGkey('');toast('Ключ видалено');render();return}
  if(ds.pick!==undefined){const f=window._fl[+ds.pick];if(f&&!f.hdr)portion(f);return}
  if(ds.g){$('#pg').value=r0(+ds.g);pv();return}
  if(ds.back){foodSheet();return}
  if(ds.addp){const g=num($('#pg').value);if(g<=0){toast('Вкажи вагу');return}const m=g/100;pushFood({n:P.n,g,...scale(P,m)});toast('Додано');closeSheet();return}
  if(ds.savecustom){const n=$('#cN').value.trim(),k=num($('#cK').value);if(!n||k<=0){toast('Назва і ккал обов’язкові');return}
    const f={id:nid(),n,k,p:num($('#cP').value),f:num($('#cF').value),c:num($('#cC').value),fb:num($('#cFb').value),sg:num($('#cSg').value),sl:num($('#cSl').value),...($('#cL').checked?{l:1}:{})};S.custom.unshift(f);touch('main');portion(f);return}
  if(ds.quick){const n=$('#qN').value.trim()||'Перекус',k=num($('#qK').value);if(k<=0){toast('Вкажи ккал');return}pushFood({n,g:0,k,p:0,f:0,c:0});toast('Додано');closeSheet();return}
  if(ds.ai){runAI();return}
  if(ds.aiadd){const picks=[...sbd.querySelectorAll('[data-aichk]')].filter(x=>x.checked).map(x=>AIres[+x.dataset.aichk]);if(!picks.length){toast('Нічого не вибрано');return}
    picks.forEach(it=>pushFood(it));toast('Додано: '+picks.length);closeSheet();return}
  if(ds.delcustom){S.custom=S.custom.filter(f=>f.id!==ds.delcustom);touch('main');render();return}
  if(ds.goal){S.profile.goal=ds.goal;S.profile.set=true;touch('main');render();return}
  if(ds.savew){const kg=num($('#wIn').value);if(kg<25||kg>350){toast('Вкажи вагу в кг');return}const t=today();S.weights=S.weights.filter(x=>x.d!==t);S.weights.push({d:t,kg:r1(kg)});S.profile.w=r1(kg);touch('main');toast('Вагу записано');render();return}
  if(ds.neww){newWorkout();return}
  if(ds.tpl!==undefined){const i=+ds.tpl,t=TPL[i];startW({n:t?tx(t.n):(LANG==='en'?'Workout':'Тренування'),ex:t?t.ex.map(n=>({n:tx(n),sets:[{r:'',w:''},{r:'',w:''},{r:'',w:''}]})):[],min:'',kcal:0},cur,null);return}
  if(ds.repeat){const w=allWorkouts()[0].w;startW({n:w.n,ex:w.ex.map(e=>({n:e.n,sets:e.sets.map(s=>({r:s.r,w:s.w}))})),min:w.min,kcal:0},cur,null);return}
  if(ds.editw){const d=ds.wd||cur,w=day(d).ex.find(x=>x.id===ds.editw);if(w)startW(w,d,w.id);return}
  if(ds.addset){const e=W.ex[+ds.addset],l=e.sets[e.sets.length-1];e.sets.push({r:l?l.r:'',w:l?l.w:''});editW();return}
  if(ds.delset){const[i,j]=ds.delset.split('.').map(Number);W.ex[i].sets.splice(j,1);editW();return}
  if(ds.delex){W.ex.splice(+ds.delex,1);editW();return}
  if(ds.addex){const n=$('#nex').value.trim();if(!n)return;W.ex.push({n,sets:[{r:'',w:''},{r:'',w:''},{r:'',w:''}]});editW();return}
  if(ds.savewk){
    W.ex=W.ex.map(e=>({n:e.n.trim()||(LANG==='en'?'Exercise':'Вправа'),sets:e.sets.filter(s=>String(s.r).trim()!==''||String(s.w).trim()!=='').map(s=>({r:num(s.r),w:num(s.w)}))})).filter(e=>e.sets.length||W.ex.length===1);
    W.min=num(W.min);W.kcal=num(W.kcal);if(!W.kcal&&W.min)W.kcal=r0(4*3.5*curW()/200*W.min);
    const d=dayW(WD);if(WID){const i=d.ex.findIndex(x=>x.id===WID);if(i>=0)d.ex[i]={...W,id:WID}}else d.ex.push({...W,id:nid()});
    touch('d-'+WD);closeSheet();celebrate('Тренування збережено!');return}
  if(ds.delw){const d=dayW(WD);d.ex=d.ex.filter(x=>x.id!==WID);touch('d-'+WD);toast('Видалено');closeSheet();return}
});
document.addEventListener('input',e=>{
  const t=e.target,ds=t.dataset;

  if(ds.sr){const[i,j]=ds.sr.split('.').map(Number);W.ex[i].sets[j].r=t.value}

document.addEventListener('change',e=>{
  const t=e.target,k=t.dataset.pf;if(!k)return;const p=S.profile;
  if(k==='sex')p.sex=t.value;else if(k==='act')p.act=+t.value;
  else if(k==='w'){const kg=num(t.value);if(kg>=25&&kg<=350){p.w=r1(kg);const td=today();S.weights=S.weights.filter(x=>x.d!==td);S.weights.push({d:td,kg:p.w})}}
  else{const v=num(t.value);if(k==='kcal')p.kcal=v>=800?r0(v):0;else if(v>0)p[k]=r0(v)}
  p.set=true;touch('main');render();

async function runAI(){
  const txt=$('#aiT').value.trim();if(!txt){toast('Опиши, що з’їв');return}
  const s=await getAI();const out=$('#aiR'),btn=$('#aiB');
  if(!s){out.innerHTML='<div class="empty">'+(window.claude?'ШІ тут недоступний.':'Встав ключ Gemini в Налаштуваннях.')+'</div>';return}
  btn.disabled=true;btn.textContent='Рахую…';const t0=Date.now();const tick=setInterval(()=>{if(btn.isConnected)btn.textContent='Рахую… '+Math.round((Date.now()-t0)/1000)+' с';else clearInterval(tick)},1000);out.innerHTML='';
  aiCtl&&aiCtl.abort();aiCtl=new AbortController();
  const prompt=LANG==='en'?`You are a nutritionist. The user described what they ate. Split it into separate foods or dishes; for each, estimate a realistic portion weight in grams and the calories and macros for that portion. Reply ONLY with a JSON array, no explanations, in the format: [{"n":"name in English","g":grams,"k":kcal,"p":protein_g,"f":fat_g,"c":carbs_g,"fb":fibre_g,"sg":sugar_g,"sl":salt_g}]. For drinks (milk, juice, coffee, tea, soda, alcohol, etc.) put millilitres in g and add "l":true. Numbers without units.\nDescription: ${txt}`:`Ти нутриціолог. Користувач описав, що з'їв. Розбий опис на окремі продукти або страви, для кожного оціни реалістичну вагу порції в грамах і калорійність та БЖВ саме на цю порцію (типові українські порції). Відповідай ТІЛЬКИ JSON-масивом без пояснень, у форматі: [{"n":"назва українською","g":грами,"k":ккал,"p":білки_г,"f":жири_г,"c":вуглеводи_г,"fb":клітковина_г,"sg":цукор_г,"sl":сіль_г}]. Для напоїв (молоко, сік, кава, чай, газування, алкоголь тощо) у полі g вкажи мілілітри і додай "l":true. Числа — без одиниць.\nОпис: ${txt}`;
  try{
    const r=await s(prompt,{signal:aiCtl.signal,modelTier:'quick'});
    const t=r.text||'',a=t.indexOf('['),z=t.lastIndexOf(']');
    const arr=a>=0&&z>a?JSON.parse(t.slice(a,z+1)):[];
    AIres=(Array.isArray(arr)?arr:[]).filter(x=>x&&x.n).slice(0,20).map(x=>({n:String(x.n).slice(0,80),g:r0(num(x.g)),k:r0(num(x.k)),p:r1(num(x.p)),f:r1(num(x.f)),c:r1(num(x.c)),fb:r1(num(x.fb)),sg:r1(num(x.sg)),sl:r1(num(x.sl)),...(x.l?{l:1}:{})}));
    if(!AIres.length){out.innerHTML='<div class="empty">Не вдалося розібрати. Спробуй написати простіше.</div>'}
    else{const tot=sum(AIres);out.innerHTML=`<div class="card">${AIres.map((x,i)=>`<label class="item" style="margin:0;color:var(--ink);font-size:16px"><input type="checkbox" checked data-aichk="${i}" style="width:22px;min-height:22px;flex:none"><div class="grow"><div class="nm">${esc(x.n)}</div><div class="sm mut">${x.g} ${U(x)} · Б ${x.p} Ж ${x.f} В ${x.c}</div></div><span class="k">${x.k}</span></label>`).join('')}
      <div class="row sp" style="margin-top:8px"><b>Разом</b><span class="k num">${r0(tot.k)} ккал</span></div><div class="hint">Це приблизна оцінка ШІ.</div></div><button class="btn w" style="margin-top:10px" data-aiadd="1">Додати вибране</button>`}
  }catch(e){
    if(e&&e.name==='AbortError')return;
    out.innerHTML=`<div class="empty">${e&&e.code==='busy'?'Сервери Gemini зараз перевантажені, спробуй ще раз за хвилину.':e&&e.code==='rate_limited'?'Забагато запитів, спробуй за хвилину.':e&&e.code==='not_granted'?'Доступ до ШІ не надано.':e&&e.code==='bad_key'?'Ключ не підходить — перевір його в Налаштуваннях.':e&&e.code==='offline'?'Немає інтернету.':e&&e.code==='api'?'Помилка: '+esc(String(e.msg).slice(0,220)):'Не вийшло порахувати, спробуй ще раз.'}</div>`;
  }finally{clearInterval(tick);if(btn){btn.disabled=false;btn.textContent='Порахувати'}}
}

window.forBack=()=>{if(!sheet.classList.contains('hidden')){closeSheet();return true}if(tab!=='today'){tab='today';render();return true}return false};
setTimeout(syncNative,300);
if(!S.profile.set)tab='today';
render();
}
